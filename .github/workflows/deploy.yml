name: Deploy to GitHub Pages

# main 브랜치에 push 되면 자동으로 빌드 → 배포
on:
  # 6시간마다 뉴스를 새로 받아 다시 배포한다
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch: # 저장소 Actions 탭에서 수동 실행도 가능

# Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 최신 것만 진행
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 뉴스 수집 (GeekNews)
        # 반드시 빌드 앞에 둔다. public/news.json 을 빌드가 dist로 복사하기 때문이다.
        # 피드가 죽어도 배포는 계속한다. 저장소에 있는 직전 news.json이 쓰인다.
        continue-on-error: true
        run: npm run news

      - name: 빌드
        # API 키는 저장소 Secrets에서 주입한다. 저장소 소스에는 남지 않는다.
        # 다만 VITE_ 값은 빌드 때 번들에 문자열로 박히므로 배포된 JS에서는 읽힌다.
        # 정적 사이트에서는 피할 수 없다. 그래서 사용량이 제한된 데모용 키만 넣는다.
        env:
          VITE_KOFIC_API_KEY: ${{ secrets.VITE_KOFIC_API_KEY }}
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
        run: npm run build

      - name: SPA 폴백 생성
        # GitHub Pages는 정적 호스팅이라 /about 같은 경로를 모른다.
        # index.html을 404.html로 복사해두면 앱이 부팅되고 라우터가 경로를 처리한다.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
